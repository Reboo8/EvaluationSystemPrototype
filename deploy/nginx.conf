# Serves the built SPA. Cloud Run sends traffic to $PORT (8080) with a `Via: 1.1 google` header.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;          # Cloud Run is a proxy — without this nginx never compresses
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  # Plain health endpoint. Cloud Run only calls it if a probe is configured; its default TCP probe gates startup.
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Hashed build assets: cache for a year — but only on success (no `always`), so a 404 is never cached.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Everything else: the app shell (HashRouter → every route is index.html), never cached
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
